server {
    listen 8030;
    server_name localhost;
    access_log /var/log/nginx/bankgraph_access.log;
    error_log /var/log/nginx/bankgraph_error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        proxy_pass http://localhost:3030/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /readyz {
        proxy_pass http://localhost:3030/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /actuator/health {
        proxy_pass http://localhost:3030/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /www/bankgraph/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 2G;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_request_buffering off;
        proxy_pass http://localhost:3030/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/ {
        proxy_pass http://localhost:3030/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /api-docs/ {
        proxy_pass http://localhost:3030/api-docs/;
        proxy_set_header Host $host;
    }
}
