services:
  neo4j:
    image: neo4j:5.15
    container_name: bankgraph-neo4j
    ports:
      - "7474:7474"
      - "7688:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    environment:
      NEO4J_AUTH: neo4j/neo4j@123
      NEO4J_dbms_memory_pagecache_size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p 'neo4j@123' 'RETURN 1' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

  tugraph:
    image: tugraph/tugraph-runtime-centos7:latest
    container_name: bankgraph-tugraph
    ports:
      - "7070:7070"
      - "7687:7687"
      - "9090:9090"
    volumes:
      - tugraph_data:/var/lib/lgraph/data
      - tugraph_logs:/var/log/lgraph_log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7070/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  janusgraph:
    image: janusgraph/janusgraph:1.1.0
    container_name: bankgraph-janusgraph
    ports:
      - "8182:8182"
    volumes:
      - janusgraph_data:/var/lib/janusgraph
      - ./janusgraph-health.sh:/health.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/health.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    container_name: bankgraph-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.31.94:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  tugraph_data:
  tugraph_logs:
  janusgraph_data:
  kafka_data:
