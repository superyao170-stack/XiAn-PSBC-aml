name: bankgraph-stack

services:
  postgres:
    image: ${POSTGRES_IMAGE:-datagraph-bank/postgres:16-alpine}
    container_name: bankgraph-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-databank}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  tugraph:
    image: ${TUGRAPH_IMAGE:-datagraph-bank/tugraph:4.5.2}
    platform: linux/amd64
    container_name: bankgraph-tugraph
    command: ["/bin/sh", "-c", "lgraph_server -d run"]
    ports:
      - "7070:7070"
      - "7687:7687"
      - "9090:9090"
    volumes:
      - tugraph_data:/var/lib/lgraph/data
      - tugraph_logs:/var/log/lgraph_log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7070/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  corenlp:
    image: ${CORENLP_IMAGE:-datagraph-bank/corenlp:4.5.10}
    build:
      context: ../..
      dockerfile: environment/docker/CoreNLP-4.5.10.Dockerfile
      additional_contexts:
        corenlp_dist: ${CORENLP_DISTRIBUTION_DIR:-/Users/sunnytearlie/Downloads/stanford-corenlp-4.5.10}
    container_name: bankgraph-corenlp
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  bge-models:
    image: ${BGE_MODELS_IMAGE:-datagraph-bank/bge-models:e44369c}
    build:
      context: ../..
      dockerfile: environment/docker/BGE-M3.Dockerfile
    container_name: bankgraph-bge-models
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-bankgraph_postgres_data}
    external: true
  tugraph_data:
    name: ${TUGRAPH_VOLUME:-deploy_tugraph_data}
    external: true
  tugraph_logs:
    name: ${TUGRAPH_LOG_VOLUME:-deploy_tugraph_logs}
    external: true
