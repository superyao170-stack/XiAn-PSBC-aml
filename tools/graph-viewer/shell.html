<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#eef3fa;color:#1f2d3d;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif}
.kg-root{display:flex;height:100vh;flex-direction:column;padding:14px 16px 16px;gap:12px}

.kg-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.kg-title h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px}
.kg-title p{margin:4px 0 0;color:#7b8da5;font-size:12px}
.kg-stats{display:flex;flex-wrap:wrap;gap:8px}
.kg-stats span{display:flex;min-width:88px;flex-direction:column;padding:6px 12px;border:1px solid #dde7f3;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(31,45,61,.04)}
.kg-stats em{color:#8ea4bf;font-size:11px;font-style:normal}
.kg-stats b{margin-top:2px;font-size:15px;font-weight:600}

.kg-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.kg-legend{display:flex;flex-wrap:wrap;gap:7px}
.kg-chip{display:inline-flex;align-items:center;padding:5px 11px 5px 5px;border:1px solid #dde7f3;border-radius:999px;background:#fff;color:#5b6d84;cursor:pointer;font-family:inherit;font-size:12px;gap:6px;opacity:.5;transition:opacity .15s,border-color .15s}
.kg-chip.on{border-color:var(--c);color:#25384f;opacity:1}
.kg-chip i{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-style:normal;font-weight:600}
.kg-chip b{margin-left:3px;color:#8ea4bf;font-size:11px;font-weight:600}

.kg-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.kg-actions button,.kg-layout,.kg-search{height:30px;padding:0 11px;border:1px solid #dde7f3;border-radius:8px;background:#fff;color:#44576f;cursor:pointer;font-family:inherit;font-size:12px;outline:none}
.kg-actions button:hover,.kg-layout:hover{border-color:#1677ff;color:#1677ff}
.kg-actions button.on{border-color:#1677ff;background:#eef6ff;color:#1677ff}
.kg-search{width:170px;cursor:text}
.kg-search:focus{border-color:#1677ff}

.kg-stage{position:relative;flex:1;min-height:360px;overflow:hidden;border:1px solid #dce6f2;border-radius:14px;background:radial-gradient(circle at 50% 42%,#fff 0,#f7faff 56%,#eaf1fa 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 6px 24px rgba(35,56,84,.06)}
.kg-canvas{display:block;cursor:grab;touch-action:none}
.kg-zoom{position:absolute;z-index:5;top:14px;right:14px;display:flex;padding:4px;border:1px solid #d9e4f0;border-radius:10px;background:rgba(255,255,255,.92);box-shadow:0 5px 18px rgba(35,56,84,.12);gap:4px;backdrop-filter:blur(8px)}
.kg-zoom button{width:30px;height:30px;border:0;border-radius:7px;background:transparent;color:#344861;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700}
.kg-zoom button:hover{background:#eaf3ff;color:#1677ff}
.kg-hint{position:absolute;z-index:3;bottom:12px;left:14px;padding:5px 10px;border-radius:7px;background:rgba(255,255,255,.8);color:#8697ad;font-size:11px;pointer-events:none}

.kg-tip{position:absolute;z-index:12;width:284px;padding:11px 13px;border:1px solid rgba(133,157,187,.25);border-radius:11px;background:rgba(17,29,47,.96);box-shadow:0 14px 34px rgba(15,23,42,.28);color:#f7fbff;pointer-events:none;backdrop-filter:blur(8px)}
.kg-tip b{display:flex;align-items:center;color:#b9cae0;font-size:11px;font-weight:500;gap:7px}
.kg-tip b u{display:inline-flex;width:21px;height:21px;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;text-decoration:none}
.kg-tip strong{display:block;margin:7px 0 6px;font-size:13px;line-height:1.4}
.kg-tip span{display:grid;margin-top:4px;font-size:11px;gap:8px;grid-template-columns:74px minmax(0,1fr)}
.kg-tip em{overflow:hidden;color:#8ea4bf;font-style:normal;text-overflow:ellipsis;white-space:nowrap}
.kg-tip i{overflow:hidden;color:#e5edf7;font-style:normal;text-overflow:ellipsis;white-space:nowrap}
.kg-tip small{display:block;margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,.12);color:#7f93ad;font-size:10px}

.kg-panel{position:absolute;z-index:8;top:14px;right:58px;display:flex;overflow:hidden;width:320px;max-height:calc(100% - 28px);flex-direction:column;border:1px solid #dbe5f1;border-radius:12px;background:rgba(255,255,255,.97);box-shadow:0 16px 40px rgba(28,45,70,.16);backdrop-filter:blur(10px)}
.kg-panel header{display:flex;align-items:center;padding:12px 13px;border-bottom:1px solid #edf2f8;gap:10px}
.kg-panel header i{display:inline-flex;width:30px;height:30px;flex:0 0 auto;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#fff;font-size:13px;font-style:normal;font-weight:700}
.kg-panel header div{min-width:0;flex:1}
.kg-panel header b{display:block;overflow:hidden;font-size:13px;text-overflow:ellipsis;white-space:nowrap}
.kg-panel header em{display:block;margin-top:2px;overflow:hidden;color:#8ea4bf;font-size:11px;font-style:normal;text-overflow:ellipsis;white-space:nowrap}
.kg-close{width:24px;height:24px;flex:0 0 auto;border:0;border-radius:6px;background:#f2f6fb;color:#6d8099;cursor:pointer;font-size:12px}
.kg-close:hover{background:#e6eefa;color:#1677ff}
.kg-panel-body{overflow-y:auto;padding:12px 13px 14px}
.kg-panel-body dl{display:grid;margin:0;font-size:12px;gap:6px 10px;grid-template-columns:82px minmax(0,1fr)}
.kg-panel-body dt{overflow:hidden;color:#8ea4bf;text-overflow:ellipsis;white-space:nowrap}
.kg-panel-body dd{margin:0;color:#2b3d54;line-height:1.55;word-break:break-word}
.kg-panel-body h4{margin:14px 0 7px;padding-top:11px;border-top:1px solid #eef3f9;color:#5b6d84;font-size:12px;font-weight:600}
.kg-panel-body ul{margin:0;padding:0;font-size:12px;list-style:none}
.kg-panel-body li{padding:5px 0;border-bottom:1px dashed #f0f4f9;color:#42566f;cursor:pointer;line-height:1.5}
.kg-panel-body li:hover{color:#1677ff}
.kg-panel-body li span{display:inline-block;margin-right:5px;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);font-size:11px}
.kg-panel-body li.kg-empty{color:#9db0c6;cursor:default}
.kg-neighbours{display:flex;flex-wrap:wrap;margin:0;gap:6px}
.kg-neighbours a{padding:3px 9px;border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:999px;background:color-mix(in srgb,var(--c) 8%,#fff);color:var(--c);cursor:pointer;font-size:11px}
.kg-neighbours a:hover{background:color-mix(in srgb,var(--c) 18%,#fff)}

@media (max-width:620px){
  .kg-panel{right:10px;left:10px;width:auto}
  .kg-search{width:120px}
}
</style>
</head>
<body>
<div id="kg-app"></div>
<script>/*__ENGINE__*/</script>
<script>
  window.KG_DATA = /*__DATA__*/null;
  window.kgApp = window.KG.render(document.getElementById('kg-app'), window.KG_DATA);
</script>
</body>
</html>
